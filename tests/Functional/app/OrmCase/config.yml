imports:
    - { resource: '../config/default.yml' }

doctrine:
    dbal:
        url: 'sqlite:///:memory:'
    orm:
        mappings:
            CryptoTest:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/tests/Fixtures/Entity'
                prefix: 'AgentSIB\CryptoBundle\Tests\Fixtures\Entity'

agentsib_crypto:
    secret_sources:
        test: { simple: orm-case-secret }
    ciphers:
        v1: { cipher: aes256, secret_source: test }
    current_cipher: v1
